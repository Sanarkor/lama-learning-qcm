/* correction : icônes ✓ / ✗ en plus des couleurs, lisibles dans tous les thèmes */
.opt.good,.opt.bad{border-width:3px;font-weight:600}
.opt.good::after,.opt.bad::after{margin-left:auto;flex:0 0 auto;font-weight:900;font-size:1.25em;line-height:28px;padding-left:8px}
.opt.good::after{content:'✓';color:var(--ok)}.opt.bad::after{content:'✗';color:var(--ko)}
.opt.bad{box-shadow:0 0 0 2px var(--kobg) inset}
.chip .sw{display:inline-block;width:18px;height:18px;border-radius:50%;vertical-align:-4px;margin-right:6px;border:2px solid rgba(255,255,255,.85);box-shadow:0 0 0 1px rgba(0,0,0,.25)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);overscroll-behavior-y:none}
body{font:var(--fs)/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;min-height:100vh;-webkit-tap-highlight-color:transparent}
.top{display:flex;align-items:center;gap:10px;padding:7px 12px 6px;padding-top:max(7px,env(safe-area-inset-top));background:var(--card);border-bottom:3px solid var(--gold);position:sticky;top:0;z-index:5}
.brand img{display:block;height:40px;width:auto}
.ttl{display:flex;flex-direction:column;line-height:1.15}.ttl b{color:var(--navy);font-size:1.05em}.ttl span{color:var(--muted);font-size:.8em}
html.dark .brand img{background:#fff;border-radius:8px;padding:2px 4px}
main{max-width:760px;margin:0 auto;padding:16px 14px 40px;outline:none}
h1{font-size:1.35em;color:var(--navy);margin:.2em 0 .6em}h2{font-size:1.1em;color:var(--navy);margin:1.2em 0 .5em}
p{margin:.5em 0}a{color:var(--navy)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{display:flex;flex-direction:column;justify-content:center;min-height:104px;padding:14px;border-radius:16px;background:var(--grad);color:#fff;text-decoration:none;border:0;font:inherit;text-align:left;cursor:pointer;box-shadow:0 4px 14px var(--shadow)}
.tile b{font-size:1.08em}.tile span{font-size:.82em;opacity:.85;margin-top:4px}
.tile.gold{background:var(--grad2);color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.3)}.tile.soft{background:var(--grad3)}.tile.wide{grid-column:1/-1}
.tile.hero-tile{min-height:132px;background:var(--hero)}.tile.hero-tile b{font-size:1.35em}
html.dark .tile.gold{color:#fff}
.hero{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--magenta);border-radius:14px;padding:12px 14px;margin-bottom:14px}
.hero small{color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:10px 16px;border-radius:12px;border:2px solid var(--navy);background:var(--navy);color:#fff;font:inherit;font-weight:600;cursor:pointer;text-decoration:none}
html.dark .btn{background:var(--navy2);border-color:var(--navy2)}
.btn.ghost{background:transparent;color:var(--navy)}html.dark .btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.gold{background:var(--btn);border-color:var(--btnb);color:#fff}
.btn.block{width:100%}.row{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}.row>.btn{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 12px}
.chip{padding:8px 12px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:.92em;cursor:pointer}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}html.dark .chip.on{background:var(--navy2);border-color:var(--navy2)}
.list a,.list button{display:flex;justify-content:space-between;align-items:center;width:100%;padding:12px 14px;margin:8px 0;border-radius:12px;background:var(--card);border:1px solid var(--line);color:var(--ink);text-decoration:none;font:inherit;text-align:left;cursor:pointer}
.list small{color:var(--muted);white-space:nowrap;margin-left:10px}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin:6px 0 12px}.bar i{display:block;height:100%;background:var(--gold)}
.qhead{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:.85em;gap:8px}
.tag{display:inline-block;font-size:.8em;padding:3px 10px;border-radius:999px;background:var(--gold2);color:var(--tagc);font-weight:700}
html.dark .tag{color:#fff}
.q{font-size:1.1em;font-weight:600;margin:10px 0 14px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:inherit;text-align:left;cursor:pointer;min-height:52px}
.opt .l{flex:0 0 28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--bg);font-weight:700;color:var(--navy)}
.opt.sel{border-color:var(--navy)}.opt.sel .l{background:var(--navy);color:#fff}
.opt.good{border-color:var(--ok);background:var(--okbg)}.opt.good .l{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--ko);background:var(--kobg)}.opt.bad .l{background:var(--ko);color:#fff}
.opt:disabled{cursor:default;opacity:1}
.expl{margin-top:12px;padding:12px;border-radius:12px;background:var(--bg);border-left:4px solid var(--gold)}
.expl b.ok{color:var(--ok)}.expl b.ko{color:var(--ko)}
.timer{font-variant-numeric:tabular-nums;font-weight:700;color:var(--navy)}.timer.low{color:var(--ko)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px;margin:12px 0}
.grid button{height:38px;border-radius:8px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:.85em;cursor:pointer}
.grid button.done{background:var(--navy);color:#fff;border-color:var(--navy)}.grid button.cur{outline:3px solid var(--gold)}
.grid button.g{background:var(--ok);color:#fff;border-color:var(--ok)}.grid button.b{background:var(--ko);color:#fff;border-color:var(--ko)}
.score{font-size:2.4em;font-weight:800;color:var(--navy);text-align:center;margin:6px 0}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}.kpis div{background:var(--bg);border-radius:10px;padding:8px}.kpis b{display:block;font-size:1.3em}
table{width:100%;border-collapse:collapse;font-size:.92em}td,th{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left}
.muted{color:var(--muted)}.small{font-size:.86em}
ul.m{padding-left:1.2em}ul.m li{margin:.35em 0}
.back{display:inline-block;margin-bottom:6px;color:var(--muted);text-decoration:none;font-size:.92em}
select{font:inherit;padding:8px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
#mkbadge{position:fixed;right:8px;bottom:6px;z-index:9999;font:11px/20px system-ui,Arial,sans-serif;color:#fff;background:var(--badge);padding:2px 8px 2px 3px;border-radius:12px;pointer-events:none;max-width:calc(100vw - 16px);white-space:nowrap;display:flex;align-items:center;gap:5px}#mkbadge img{width:20px;height:20px;border-radius:50%;display:block}body{padding-bottom:34px!important}@media print{#mkbadge{display:none}}
@media (min-width:600px){.tiles{grid-template-columns:repeat(3,1fr)}.tile.wide{grid-column:auto}}
@media (min-width:600px){.tile.hero-tile{grid-column:1/-1}}

.homebtn{margin-left:auto;display:inline-flex;align-items:center;gap:6px;min-height:42px;padding:8px 13px;border-radius:999px;background:var(--btn);border:2px solid var(--btnb);color:#fff;font-weight:700;text-decoration:none;font-size:.95em;line-height:1;box-shadow:var(--shadow);white-space:nowrap;flex-shrink:0}
.homebtn:hover,.homebtn:focus-visible{filter:brightness(1.1)}
.homebtn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.homebtn svg{display:block}
.top .ttl{min-width:0}
.setbtn{margin-left:0;width:42px;height:42px;padding:0;justify-content:center}
@media (max-width:440px){.homebtn span{display:none}.homebtn{width:42px;height:42px;padding:0;justify-content:center}.top{gap:8px}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;margin:0}

/* ---------- Accueil compact : tout tient sur un écran de téléphone ---------- */
body.is-home main{padding:12px 12px 6px}
body.is-home .tiles{gap:9px}
body.is-home .tile{min-height:84px;padding:11px 13px;border-radius:14px;box-shadow:0 3px 10px var(--shadow);line-height:1.25}
body.is-home .tile b{font-size:.98em}
body.is-home .tile span{font-size:.8em;margin-top:3px}
body.is-home .tile.hero-tile{min-height:100px}
body.is-home .tile.hero-tile b{font-size:1.2em}
@media (max-width:599px){body.is-home .tiles>.tile:last-child:nth-child(even){grid-column:1/-1}}
.ttl b,.ttl span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:370px){.brand img{height:34px}.ttl b{font-size:1em}.ttl span{font-size:.78em}.top{padding-left:10px;padding-right:10px}}
#ptr{position:fixed;top:0;left:50%;transform:translate(-50%,0);z-index:20;margin-top:-44px;padding:8px 14px;border-radius:999px;background:var(--card);color:var(--navy);border:2px solid var(--gold);font-weight:700;font-size:.9em;box-shadow:var(--shadow);opacity:0;pointer-events:none;white-space:nowrap;transition:opacity .15s}
#ptr.on{opacity:1;margin-top:8px}#ptr.ready{background:var(--btn);color:#fff;border-color:var(--btnb)}

.ttl .motto{font-family:'Dancing Script','Segoe Script','Brush Script MT','Snell Roundhand',cursive;font-weight:600;font-size:1em;line-height:1.1;color:var(--gold);letter-spacing:.01em;margin-top:1px}
html.dark .ttl .motto{color:var(--gold)}
@media (max-width:370px){.ttl .motto{font-size:.95em}}
/* En-tête : logo seul (titre texte masqué), sous-titre script agrandi et centré, bouton de langue */
.top .ttl{flex:1 1 auto;min-width:0;align-items:center;justify-content:center;text-align:center;align-self:stretch}
.top .ttl .motto{font-size:clamp(18px,5.6vw,30px);line-height:1.02;white-space:normal;overflow:visible;text-overflow:clip;margin:0;overflow-wrap:normal;text-wrap:balance}
.langbtn{margin-left:0;cursor:pointer;font:inherit}
.langbtn .flag{width:26px;height:26px;border-radius:50%;overflow:hidden;display:block;box-shadow:0 0 0 2px rgba(255,255,255,.9)}
.langbtn .flag svg{width:100%;height:100%;display:block}
/* le bouton montre le drapeau de la langue ACTUELLE ; un appui bascule vers l'autre */
html:not(.en) .flag-en,html.en .flag-fr{display:none}
.langbtn{position:relative}
.langbtn.off .flag{opacity:.5;filter:grayscale(1)}
.langbtn .lockb{display:none;position:absolute;right:-3px;bottom:-3px;width:17px;height:17px;border-radius:50%;background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.35);align-items:center;justify-content:center}
.langbtn .lockb svg{width:11px;height:11px}
.langbtn.off .lockb{display:flex}
#langmenu{position:fixed;z-index:60;min-width:172px;max-width:calc(100vw - 16px);box-sizing:border-box;padding:6px;border-radius:14px;background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:0 10px 28px var(--shadow),0 2px 6px rgba(0,0,0,.12);opacity:0;transform:translateY(-6px) scale(.97);transform-origin:var(--ax,85%) top;transition:opacity .16s ease,transform .18s ease;pointer-events:none}
#langmenu.on{opacity:1;transform:none;pointer-events:auto}
#langmenu::before{content:"";position:absolute;top:-6px;left:calc(var(--ax,85%) - 6px);width:12px;height:12px;background:var(--card);border-left:1px solid var(--line);border-top:1px solid var(--line);transform:rotate(45deg)}
#langmenu .lopt{position:relative;display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border:0;border-radius:10px;background:transparent;color:inherit;font:inherit;font-weight:600;text-align:left;cursor:pointer}
#langmenu .lopt:hover,#langmenu .lopt:focus-visible{background:var(--gold2);outline:none}
#langmenu .lopt.cur{background:var(--gold2);color:var(--navy)}
#langmenu .lopt.dis{opacity:.5;cursor:not-allowed}
#langmenu .lopt.dis .flag{filter:grayscale(1)}
#langmenu .lopt .flag{width:24px;height:24px;border-radius:50%;overflow:hidden;flex-shrink:0;box-shadow:0 0 0 1px var(--line)}
#langmenu .lopt .flag svg{width:100%;height:100%;display:block}
#langmenu .ltx{flex:1}
#langmenu .ck,#langmenu .lk{width:18px;height:18px;flex-shrink:0}
#langmenu .ck{color:var(--gold)}
#langmenu .lmsg{display:flex;gap:7px;align-items:flex-start;margin:2px 4px 6px;padding:7px 9px;border-radius:9px;background:var(--bg);color:var(--muted);font-size:.82em;line-height:1.3;max-width:230px}
#langmenu .lmsg .lk{width:14px;height:14px;margin-top:1px}
@media (prefers-reduced-motion:reduce){#langmenu{transition:none}}
.langbtn.busy .flag{animation:lgpulse .8s ease-in-out infinite alternate}
@keyframes lgpulse{from{opacity:1}to{opacity:.35}}
#toast{position:fixed;left:50%;bottom:calc(52px + env(safe-area-inset-bottom));transform:translate(-50%,12px);max-width:min(92vw,420px);padding:9px 14px;border-radius:12px;background:#111827;color:#fff;font-size:.86em;line-height:1.3;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:50}
#toast.on{opacity:1;transform:translate(-50%,0)}
.top .homebtn:not(.setbtn){margin-left:0}
@media (max-width:440px){.top{gap:6px}}
